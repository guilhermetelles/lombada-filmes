<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lombada · entrar</title>
    <style>
      :root {
        --bg: #f6f3ee;
        --surface: #ffffff;
        --text: #1f1b16;
        --muted: #6b6259;
        --line: #e4ddd3;
        --accent: #8a2c1d;
        --ok: #2f6b3a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17140f;
          --surface: #221e18;
          --text: #f1ece4;
          --muted: #a89e92;
          --line: #3a332a;
          --accent: #e0876f;
          --ok: #8fc79a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        width: 100%;
        max-width: 560px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 28px;
      }
      h1 { margin: 0 0 4px; font-size: 1.4rem; }
      p { margin: 0 0 16px; color: var(--muted); }
      button {
        font: inherit;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        padding: 8px 14px;
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      dl { margin: 0 0 16px; display: grid; gap: 12px; }
      dt { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      dd { margin: 2px 0 0; display: flex; gap: 8px; align-items: center; }
      code {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
        font: 0.9rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
      }
      code.token { max-height: 6.5em; overflow: auto; }
      .status { margin-top: 12px; font-size: 0.9rem; color: var(--ok); min-height: 1.5em; }
      .error { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Lombada</h1>
      <p>Entrada com Google no projeto <strong>lombada-db</strong>, para pegar o seu uid antes de existir o app.</p>

      <section id="signed-out">
        <button id="sign-in" class="primary" type="button">Entrar com Google</button>
      </section>

      <section id="signed-in" hidden>
        <dl>
          <div>
            <dt>Conta</dt>
            <dd id="account"></dd>
          </div>
          <div>
            <dt>uid</dt>
            <dd><code id="uid"></code><button type="button" data-copy="uid">Copiar</button></dd>
          </div>
          <div>
            <dt>ID token (vale 1 hora; serve para chamar o backend)</dt>
            <dd><code id="token" class="token"></code><button type="button" data-copy="token">Copiar</button></dd>
          </div>
        </dl>
        <button id="sign-out" type="button">Sair</button>
      </section>

      <div id="status" class="status" role="status"></div>
    </main>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
      import {
        GoogleAuthProvider,
        getAuth,
        onAuthStateChanged,
        signInWithPopup,
        signOut,
      } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';

      // Configuração do app web do lombada-db. Não é segredo: identifica o projeto, e quem protege
      // os dados são as regras do Firestore.
      const firebaseConfig = {
        apiKey: 'AIzaSyArFUewu5wiVXBavf75rzpL95EEh-9KR98',
        authDomain: 'lombada-db.firebaseapp.com',
        projectId: 'lombada-db',
        appId: '1:971566563350:web:b8711c8101a5d4d99b7537',
      };

      const auth = getAuth(initializeApp(firebaseConfig));
      const element = (id) => document.getElementById(id);

      /**
       * Mostra uma mensagem curta abaixo do cartão.
       *
       * @param {string} message - Texto a mostrar.
       * @param {boolean} [isError] - Se é uma mensagem de erro.
       */
      function showStatus(message, isError = false) {
        element('status').textContent = message;
        element('status').classList.toggle('error', isError);
      }

      element('sign-in').addEventListener('click', async () => {
        try {
          await signInWithPopup(auth, new GoogleAuthProvider());
          showStatus('');
        } catch (error) {
          showStatus(`Não deu para entrar: ${error.code ?? error.message}`, true);
        }
      });

      element('sign-out').addEventListener('click', () => signOut(auth));

      for (const button of document.querySelectorAll('[data-copy]')) {
        button.addEventListener('click', async () => {
          await navigator.clipboard.writeText(element(button.dataset.copy).textContent);
          showStatus('Copiado.');
        });
      }

      onAuthStateChanged(auth, async (user) => {
        element('signed-out').hidden = Boolean(user);
        element('signed-in').hidden = !user;
        if (!user) return;
        element('account').textContent = `${user.displayName ?? ''} · ${user.email ?? ''}`;
        element('uid').textContent = user.uid;
        element('token').textContent = await user.getIdToken();
      });
    </script>
  </body>
</html>
